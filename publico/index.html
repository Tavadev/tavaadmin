<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TAVADEV · Páginas, chats y sistemas</title>
  <meta name="description" content="Páginas, chats de WhatsApp y sistemas sencillos. Un apartado de TAVA, teatro. Lo cuentas con tus palabras y lo dejamos funcionando." />
  <meta property="og:title" content="TAVADEV" />
  <meta property="og:description" content="Páginas, chats y sistemas, contados con tus palabras." />
  <meta property="og:image" content="/marca/logo-oscuro.jpg" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/estilos.css" />
  <script>document.documentElement.classList.add("js")</script>
</head>
<body>
  <header class="barra">
    <a class="wordmark" href="#inicio">TAVA<span>DEV</span></a>
    <a class="boton boton-pill" href="#cotizar">Hablemos</a>
  </header>
  <main id="app">
    <p class="cargando">Cargando la página.</p>
  </main>
  <form id="form-cota" class="pedido" data-ui hidden novalidate>
    <h3>La solicitud</h3>
    <p class="ayuda">Con una frase alcanza. No hace falta que suene técnico.</p>
    <label>Tu nombre
      <input name="nombre" autocomplete="name" required maxlength="80" />
    </label>
    <label>Negocio, obra o proyecto
      <input name="negocio" maxlength="80" />
    </label>
    <label>Celular
      <input name="celular" inputmode="tel" autocomplete="tel" maxlength="20" />
    </label>
    <label>Qué necesitas
      <select name="servicioId" required></select>
    </label>
    <label>Cuéntanos
      <textarea name="mensaje" required maxlength="800"></textarea>
    </label>
    <input class="trampa" tabindex="-1" autocomplete="off" name="empresa_web" aria-hidden="true" />
    <p class="error" id="error-cota" hidden></p>
    <button type="submit" class="boton boton-solido">Enviar solicitud</button>
  </form>
  <script src="/app.js"></script>
</body>
</html>
